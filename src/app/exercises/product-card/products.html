<div class="min-h-screen bg-[#004541] p-6 pt-24">

    <h1 class="mb-6 text-3xl font-bold text-white">
        Products
    </h1>

    @if (loading) {
        <p class="text-xl text-white">
            Loading...
        </p>
    }

    @if (error) {
        <p class="text-xl text-red-300">
            {{ error }}
        </p>
    }

    @if (!loading && !error) {

        <div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3">

        @for (product of products; track product.id) {

            <div class="overflow-hidden rounded-2xl bg-white shadow-lg">

                <img
                    [src]="product.thumbnail"
                    [alt]="product.title"
                    class="h-64 w-full object-cover"
                />

                <div class="p-6">

                    <h2 class="text-xl font-bold text-[#004541]">
                        {{ product.title }}
                    </h2>

                    <p class="mt-3 text-gray-500">
                        {{ product.description }}
                    </p>
                    <p class="mt-4 text-xl font-semibold text-[#004541]">
                        EGP {{ product.price }}
                    </p>

                    <div class="mt-5 flex items-center justify-between">

                        <button
                            type="button"
                            (click)="decrease(product)"
                            [disabled]="product.quantity === 0"
                            class="flex h-8 w-8 items-center justify-center rounded-lg bg-gray-200 text-xl font-bold text-gray-700 disabled:opacity-40"
                        >
                                -
                        </button>
                        <span class="text-lg font-semibold text-gray-800">
                            {{ product.quantity }}
                        </span>
                        <button
                            type="button"
                            (click)="increase(product)"
                            [disabled]="product.quantity === 10"
                            class="flex h-8 w-8 items-center justify-center rounded-lg bg-[#004541] text-xl font-bold text-white disabled:opacity-40"
                        >
                            +
                        </button>
                    </div>
                </div>            
            </div>
            <button
                type="button"
                class="mt-5 w-full rounded-lg bg-[#004541] px-4 py-3 font-semibold text-white"
                >
                    Add to Cart
            </button>
        }
    }

</div>
