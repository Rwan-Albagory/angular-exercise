<div class="product-card  min-h-screen bg-gray-100 flex items-center justify-center p-6">
    <div class="w-full max-w-md overflow-hidden rounded-4 bg-white shadow-lg">

        <img class="h-70 w-full object-fit-cover p-0 " [src]="product.image" alt="Bracelet" />

        <div class="p-6">
            <h2 class="text-xl font-bold text-success ">{{product.name}}</h2>
            <p class="mt-4 text-gray-500">{{product.description}}</p>
            <p class="mt-4 text-xl font-semibold text-green-600"> {{product.price   | currency : 'EGP'}} </p>


                <div class="d-flex justify-content-between mt-4">
                    <button 
                    type="button"
                    (click)="decrease()" 
                    [disabled]="quantity === 0"
                    class="flex h-7 w-7 items-center justify-center rounded-lg
                           bg-body-secondary rounded-2 text-xl font-bold text-gray-700 
                           transition hover:bg=bg-gray-300 
                           disabled:cursor-not-allowed disabled:opacity-40">
                        -
                    </button>
            
                    <span class="text-lg font-semibold text-gray-800">
                         {{quantity}}
                    </span>
            
                    <button
                     class="flex h-7 w-7 items-center justify-center rounded-lg
                            bg-green-600 rounded-2 text-xl font-bold text-white
                            transition hover:bg-green-700
                            disabled:cursor-not-allowed disabled:opacity-40" 
                     (click)="increase()"
                     [disabled]="quantity === 10">
                        +
                    </button>
                </div>

                <button
                type="button"
                [disabled]="quantity === 10"
                class="mt-4 w-full rounded-lg rounded-4 bg-green-600 px-4 py-3
                       font-semibold text-white transition
                       hover:bg-green-700
                       disabled:cursor-not-allowed disabled:opacity-50"
              >
                Add to Cart
              </button>
        </div>
    </div>
</div>
