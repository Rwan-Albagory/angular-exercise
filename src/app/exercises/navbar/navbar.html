<nav
  class="fixed top-0 left-0 z-50 w-full bg-mocha"
  [class.md:bg-transparent]="isHome && !menuOpen()"
>
  <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 md:px-6 md:py-4">

    <button
      type="button"
      class="flex h-11 w-11 items-center justify-center rounded-lg text-cream transition-colors duration-200 hover:cursor-pointer hover:text-gold md:hidden"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-nav"
      aria-label="Toggle navigation menu"
      (click)="toggleMenu()"
    >
      @if (menuOpen()) {
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-7 w-7" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="h-7 w-7" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
      }
    </button>

    <div class="hidden justify-center gap-22 md:flex">

      <a
        routerLink="/"
        routerLinkActive="!text-[#E8D5A3] !border-[#E8D5A3] font-semibold"
        [routerLinkActiveOptions]="{ exact: true }"
        class="border-b-2 border-transparent pb-0.5 font-medium text-white/80 no-underline
                transition-colors duration-200
                hover:text-[#C4A46A] hover:border-[#C4A46A]"
      >
        Home
      </a>

      <a
        routerLink="/products"
        routerLinkActive="!text-[#E8D5A3] !border-[#E8D5A3] font-semibold"
        class="border-b-2 border-transparent pb-0.5 font-medium text-white/80 no-underline
                transition-colors duration-200
                hover:text-[#C4A46A] hover:border-[#C4A46A]"
      >
        Products
      </a>

      <a
        routerLink="/signup"
        routerLinkActive="!text-[#E8D5A3] !border-[#E8D5A3] font-semibold"
        class="border-b-2 border-transparent pb-0.5 font-medium text-white/80 no-underline
                transition-colors duration-200
                hover:text-[#C4A46A] hover:border-[#C4A46A]"
      >
        Sign Up
      </a>

    </div>
    <button
      type="button"
      class="flex h-11 w-11 items-center justify-center rounded-lg text-cream transition-colors duration-200 hover:cursor-pointer hover:text-gold"
      (click)="toggleCart()">
      
      <div class="relative flex h-11 w-11 items-center justify-center" role="img" aria-label="Shopping cart">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor" class="h-7 w-7 text-cream" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6.75a3.75 3.75 0 1 0-7.5 0v3.75M3.75 8.25h16.5l-1.2 10.2a1.5 1.5 0 0 1-1.49 1.3H6.44a1.5 1.5 0 0 1-1.49-1.3L3.75 8.25Z" />
        </svg>
        @if (cartService.cartCount() >0) {
          <span
            class="absolute top-0.5 right-0.5 flex h-5 w-5 items-center justify-center rounded-full bg-gold text-xs font-semibold text-mocha">
            {{ cartService.cartCount() }}
          </span>
        }
        @if (cartOpen()) {
          <div 
            class="absolute right-0 top-12 z-50
                    w-80
                    rounded-2xl
                    border border-sand
                    bg-cream
                    p-4
                    shadow-2xl
                    shadow-mocha/20">

          <!-- Title -->

            <h2 class="mb-4 text-xl font-bold text-mocha">

              Your Cart

            </h2>
          <!-- Empty Cart -->

              @if (cartService.cartItems().length === 0) {

                  <div class="py-8 text-center">

                    <p class="text-taupe">

        Your cart is empty

      </p>

    </div>
      } @else {


    <!-- Products -->

    <div class="max-h-72 space-y-4 overflow-y-auto">


      @for (
        product of cartService.cartItems();
        track product.id
      ) {

        <div
          class="flex items-center gap-3
                 border-b border-sand pb-3"
        >


          <!-- Product Image -->

          <img
            [src]="product.thumbnail"
            [alt]="product.title"
            class="h-16 w-16
                   rounded-lg
                   bg-beige
                   object-contain"
          />
                 <!-- Product Information -->

          <div class="flex-1">


            <!-- Name -->

            <h3
              class="text-sm font-semibold text-mocha"
            >

              {{ product.title }}

            </h3>



            <!-- Quantity -->

            <p
              class="mt-1 text-xs text-taupe"
            >

              Quantity:
              {{ product.quantity }}

            </p>



            <!-- Total Price -->

            <p
              class="mt-1 text-sm font-bold text-mocha"
            >

              EGP
              {{ product.price * product.quantity }}

            </p>


          </div>



          <!-- Remove Button -->

          <button
            type="button"
            (click)="cartService.removeFromCart(product.id)"
            class="flex h-7 w-7
                   cursor-pointer
                   items-center justify-center
                   rounded-full
                   text-lg
                   text-mocha
                   transition
                   hover:bg-sand"
          >

            ×

          </button>

          </div>
        }
      </div>

       <!-- Checkout Button -->

    <button
      type="button"
      class="mt-5 w-full
             rounded-xl
             bg-mocha
             px-4 py-3
             font-semibold
             text-cream
             transition-colors
             duration-200
             hover:bg-mocha-soft
             active:bg-mocha-deep"
    >

      Check Out

    </button>
  }

  </div>
}

      </div>
    </button>
  </div>

  @if (menuOpen()) {
    <div id="mobile-nav" class="border-t border-white/10 bg-mocha px-4 py-2 md:hidden">
      <div class="flex flex-col ">
        <a
          routerLink="/"
          routerLinkActive="!text-[#E8D5A3] font-semibold"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex min-h-11 items-center border-b border-white/10 font-medium text-white/80 no-underline
                  transition-colors duration-200
                  hover:text-[#C4A46A]"
        >
          Home
        </a>

        <a
          routerLink="/products"
          routerLinkActive="!text-[#E8D5A3] font-semibold"
          class="flex min-h-11 items-center border-b border-white/10 font-medium text-white/80 no-underline
                  transition-colors duration-200
                  hover:text-[#C4A46A]"
        >
          Products
        </a>

        <a
          routerLink="/signup"
          routerLinkActive="!text-[#E8D5A3] font-semibold"
          class="flex min-h-11 items-center font-medium text-white/80 no-underline
                  transition-colors duration-200
                  hover:text-[#C4A46A]"
        >
          Sign Up
        </a>
      </div>
    </div>
  }
</nav>
