<div class="min-h-screen bg-gray-100 flex items-center justify-center p-6 ">

    <div class="w-full max-w-lg rounded-2xl bg- p-8 shadow-lg">
  
      <h2 class="mb-2 text-3xl font-bold text-success">
        Create Account
      </h2>
  
      <p class="mb-6 text-gray-500">
        Fill in your information below
      </p>
  
      <form>
  
        <div class="mb-2">
          <label
            for="name"
            class="mb-2 block text-sm font-semibold text-gray-700"
          >
            Name
          </label>
  
          <input
            id="name"
            type="text"
            name="name"
            [(ngModel)]="user.name"
            placeholder="Enter your name"
            class="w-full rounded-lg border border-gray-300 px-4 py-3
                   outline-none transition
                   focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          />
        </div>
  
        <div class="mb-2">
          <label
            for="email"
            class="mb-2 block text-sm font-semibold text-gray-700"
          >
            Email
          </label>
  
          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="user.email"
            placeholder="Enter your email"
            class="w-full rounded-lg border border-gray-300 px-4 py-3
                   outline-none transition
                   focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          />
        </div>
  
        <div class="mb-2">
          <label
            for="password"
            class="mb-2 block text-sm font-semibold text-gray-700"
          >
            Password
          </label>
  
          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="user.password"
            placeholder="Enter your password"
            class="w-full rounded-lg border border-gray-300 px-4 py-3
                   outline-none transition
                   focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          />
        </div>
  
        <div class="mb-4">
          <label
            for="age"
            class="mb-2 block text-sm font-semibold text-gray-700"
          >
            Age
          </label>
  
          <input
            id="age"
            type="number"
            name="age"
            [(ngModel)]="user.age"
            placeholder="Enter your age"
            class="w-full rounded-lg border border-gray-300 px-4 py-3
                   outline-none transition
                   focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          />
        </div>
  
        <button
          type="button"
          [disabled]="!canSignUp"
          class="w-full rounded-lg rounded-3 bg-success px-4 py-3
                 font-semibold text-white transition
                 hover:bg-blue-700
                 disabled:cursor-not-allowed disabled:opacity-50"
        >
          Create Account
        </button>
  
      </form>
      
      <div class="mt-8 rounded-xl bg-gray-50 p-5 bg-success">
  
        <div class="space-y-2 text-light-600">
  
          <p>
            <span class="font-semibold text-light">Name : </span>
            {{ user.name || 'Not entered yet' }}
          </p>
  
          <p>
            <span class="font-semibold text-light">Email : </span>
            {{ user.email || 'Not entered yet' }}
          </p>
  
          <p>
            <span class="font-semibold text-light">Password : </span>
            {{ user.password || 'Not entered yet' }}
          </p>
  
          <p>
            <span class="font-semibold text-light">Age : </span>
            {{ user.age || 'Not entered yet' }}
          </p>
  
        </div>
  
      </div>
  
    </div>
  
  </div>
