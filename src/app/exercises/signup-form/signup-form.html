
<div class="min-h-screen flex items-start justify-center p-6 pt-28 pb-12 bg-cream">



  <div class="w-full max-w-lg rounded-2xl border border-sand bg-card p-6 shadow-2xl shadow-mocha/10">

    <h2 class="mb-2 text-3xl font-bold text-mocha">
      Create Account
    </h2>

    <p class="mb-5 text-taupe">
      Fill in your information below
    </p>

    <form>

      <div class="mb-3">
        <label
          for="name"
          class="mb-2 block text-sm font-semibold text-ink"
        >
          Name
        </label>

        <input
          id="name"
          type="text"
          name="name"
          [(ngModel)]="user.name"
          placeholder="Enter your name"
          class="w-full rounded-lg border-2 border-sand bg-beige px-4 py-3
                 text-ink placeholder:text-taupe
                 outline-none transition
                 focus:border-mocha focus:bg-card focus:ring-2 focus:ring-gold/40"
        />
      </div>

      <div class="mb-3">
        <label
          for="email"
          class="mb-2 block text-sm font-semibold text-ink"
        >
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="user.email"
          placeholder="Enter your email"
          class="w-full rounded-lg border-2 border-sand bg-beige px-4 py-3
                 text-ink placeholder:text-taupe
                 outline-none transition
                 focus:border-mocha focus:bg-card focus:ring-2 focus:ring-gold/40"
        />
      </div>

      <div class="mb-3">
        <label
          for="password"
          class="mb-2 block text-sm font-semibold text-ink"
        >
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="user.password"
          placeholder="Enter your password"
          class="w-full rounded-lg border-2 border-sand bg-beige px-4 py-3
                 text-ink placeholder:text-taupe
                 outline-none transition
                 focus:border-mocha focus:bg-card focus:ring-2 focus:ring-gold/40"
        />
      </div>

      <div class="mb-5">
        <label
          for="age"
          class="mb-2 block text-sm font-semibold text-ink"
        >
          Age
        </label>

        <input
          id="age"
          type="number"
          name="age"
          [(ngModel)]="user.age"
          placeholder="Enter your age"
          class="w-full rounded-lg border-2 border-sand bg-beige px-4 py-3
                 text-ink placeholder:text-taupe
                 outline-none transition
                 focus:border-mocha focus:bg-card focus:ring-2 focus:ring-gold/40"
        />
      </div>

      <button
        type="button"
        [disabled]="!canSignUp"
        class="w-full rounded-lg bg-mocha px-4 py-3
                font-semibold text-cream transition-colors duration-200
                hover:bg-mocha-soft
                focus:outline-none focus:ring-2 focus:ring-gold focus:ring-offset-2 focus:ring-offset-cream
                disabled:cursor-not-allowed disabled:bg-sand disabled:text-taupe"
      >
        Create Account
      </button>

    </form>

    <div class="mt-6 rounded-xl border border-sand bg-beige p-5">

      <div class="space-y-2 text-taupe">

        <p>
          <span class="font-semibold text-mocha">Name : </span>
          {{ user.name || 'Not entered yet' }}
        </p>

        <p>
          <span class="font-semibold text-mocha">Email : </span>
          {{ user.email || 'Not entered yet' }}
        </p>

        <p>
          <span class="font-semibold text-mocha">Password : </span>
          {{ user.password || 'Not entered yet' }}
        </p>

        <p>
          <span class="font-semibold text-mocha">Age : </span>
          {{ user.age || 'Not entered yet' }}
        </p>

      </div>

    </div>

  </div>

</div>
