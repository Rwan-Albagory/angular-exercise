<div class="min-h-screen flex items-start justify-center p-6 pt-28 pb-12 bg-[#004541]">

  <div class="w-full max-w-lg rounded-2xl bg-white p-6 shadow-2xl">

    <h2 class="mb-2 text-3xl font-bold text-[#004541]">
      Create Account
    </h2>

    <p class="mb-5 text-gray-700">
      Fill in your information below
    </p>

    <form>

      <div class="mb-3">
        <label
          for="name"
          class="mb-2 block text-sm font-semibold text-gray-800"
        >
          Name
        </label>

        <input
          id="name"
          type="text"
          name="name"
          [(ngModel)]="user.name"
          placeholder="Enter your name"
          class="w-full rounded-lg border-2 border-gray-400 bg-gray-50 px-4 py-3
                 text-gray-900 placeholder:text-gray-700
                 outline-none transition
                 focus:border-[#004541] focus:bg-white focus:ring-2 focus:ring-[#004541]/25"
        />
      </div>

      <div class="mb-3">
        <label
          for="email"
          class="mb-2 block text-sm font-semibold text-gray-800"
        >
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="user.email"
          placeholder="Enter your email"
          class="w-full rounded-lg border-2 border-gray-400 bg-gray-50 px-4 py-3
                 text-gray-900 placeholder:text-gray-700
                 outline-none transition
                 focus:border-[#004541] focus:bg-white focus:ring-2 focus:ring-[#004541]/25"
        />
      </div>

      <div class="mb-3">
        <label
          for="password"
          class="mb-2 block text-sm font-semibold text-gray-800"
        >
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="user.password"
          placeholder="Enter your password"
          class="w-full rounded-lg border-2 border-gray-400 bg-gray-50 px-4 py-3
                 text-gray-900 placeholder:text-gray-700
                 outline-none transition
                 focus:border-[#004541] focus:bg-white focus:ring-2 focus:ring-[#004541]/25"
        />
      </div>

      <div class="mb-5">
        <label
          for="age"
          class="mb-2 block text-sm font-semibold text-gray-800"
        >
          Age
        </label>

        <input
          id="age"
          type="number"
          name="age"
          [(ngModel)]="user.age"
          placeholder="Enter your age"
          class="w-full rounded-lg border-2 border-gray-400 bg-gray-50 px-4 py-3
                 text-gray-900 placeholder:text-gray-700
                 outline-none transition
                 focus:border-[#004541] focus:bg-white focus:ring-2 focus:ring-[#004541]/25"
        />
      </div>

      <button
        type="button"
        [disabled]="!canSignUp"
        class="w-full rounded-lg bg-[#004541] px-4 py-3
               font-semibold text-white transition
               hover:bg-[#247475]
               focus:outline-none focus:ring-2 focus:ring-[#004541] focus:ring-offset-2
               disabled:cursor-not-allowed disabled:bg-gray-300 disabled:text-gray-600"
      >
        Create Account
      </button>

    </form>

    <div class="mt-6 rounded-xl border border-[#004541]/20 bg-[#E8F3F2] p-5">

      <div class="space-y-2 text-gray-700">

        <p>
          <span class="font-semibold text-[#004541]">Name : </span>
          {{ user.name || 'Not entered yet' }}
        </p>

        <p>
          <span class="font-semibold text-[#004541]">Email : </span>
          {{ user.email || 'Not entered yet' }}
        </p>

        <p>
          <span class="font-semibold text-[#004541]">Password : </span>
          {{ user.password || 'Not entered yet' }}
        </p>

        <p>
          <span class="font-semibold text-[#004541]">Age : </span>
          {{ user.age || 'Not entered yet' }}
        </p>

      </div>

    </div>

  </div>

</div>
